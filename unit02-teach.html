<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>《整數的乘法》大探險</title>
<style>
  :root{
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    --bg1:#eaf6f6; --bg2:#f6efe6; --ink:#243b48; --soft:#5b6f7a;
    --card:#ffffff; --line:#d7e3e6;
    --g1:#0f9e99; --g2:#7b5fd0; --g3:#e0912f;
    --ok:#2f9e6f; --okbg:#e5f6ee; --warn:#e07b3a; --warnbg:#fdefe3;
    --btn:#f2f8f8; --btnbd:#bfd7da;
    --focus:var(--g1);
    --fs:20px; --radius:22px;
  }
  *{box-sizing:inherit;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
    color:var(--ink);
    background:linear-gradient(160deg,var(--bg1),var(--bg2));
    min-height:100vh; font-size:var(--fs); line-height:1.7;
    -webkit-text-size-adjust:100%; letter-spacing:.3px;
  }
  body.calm{background:#f4f6f6;}
  .wrap{max-width:820px;margin:0 auto;padding:12px 16px 60px;}

  .brand{display:flex;align-items:center;gap:10px;padding:6px 4px;}
  .brand .dot{width:34px;height:34px;border-radius:50%;
    background:radial-gradient(circle at 32% 30%,#8fd6d2,var(--g1));
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px;
    box-shadow:0 2px 6px rgba(15,158,153,.35);}
  body.calm .brand .dot{background:#7fb3b0;box-shadow:none;}
  .brand b{font-size:15px;color:var(--soft);font-weight:700;letter-spacing:1px;}

  .ctrl{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 10px;}
  .ctrl button{border:2px solid var(--btnbd);background:var(--btn);color:var(--ink);
    border-radius:16px;padding:8px 12px;font-size:15px;font-weight:700;cursor:pointer;min-height:44px;}
  .ctrl button.on{background:var(--g1);color:#fff;border-color:var(--g1);}
  body.calm .ctrl button.on{background:#5b8f8c;border-color:#5b8f8c;}

  h1.title{font-size:27px;margin:6px 0 2px;text-align:center;font-weight:900;letter-spacing:2px;}
  .subtitle{text-align:center;color:var(--soft);font-size:15px;margin:0 0 14px;}

  .map{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);
    padding:16px 14px;box-shadow:0 8px 22px rgba(60,90,100,.08);}
  body.calm .map{box-shadow:none;}
  .bar{height:14px;background:#e9eef0;border-radius:20px;overflow:hidden;margin:4px 0 16px;}
  .bar > i{display:block;height:100%;width:0;border-radius:20px;
    background:linear-gradient(90deg,var(--g1),var(--g2));transition:width .5s ease;}
  body.calm .bar > i{background:#6aa9a5;transition:none;}
  .stations{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:520px){.stations{grid-template-columns:1fr;}}
  .st{display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-radius:18px;
    padding:12px;background:#fbfdfd;cursor:pointer;text-align:left;transition:transform .12s;}
  .st:not(.lock):hover{transform:translateY(-2px);}
  body.calm .st:hover{transform:none;}
  .st .ic{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;
    font-size:26px;flex:0 0 auto;color:#fff;}
  .st.g1 .ic{background:var(--g1);} .st.g2 .ic{background:var(--g2);} .st.g3 .ic{background:var(--g3);}
  body.calm .st .ic{filter:saturate(.6);}
  .st .tx{flex:1;min-width:0;}
  .st .tx b{display:block;font-size:18px;font-weight:800;}
  .st .tx small{color:var(--soft);font-size:13.5px;}
  .st .flag{font-size:22px;flex:0 0 auto;}
  .st.lock{opacity:.5;cursor:not-allowed;background:#f1f3f4;}
  .st .dots{display:flex;gap:4px;margin-top:4px;}
  .st .dots span{width:9px;height:9px;border-radius:50%;background:#dbe4e6;}
  .st .dots span.f{background:var(--ok);}

  .scene{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);
    padding:16px 16px 20px;box-shadow:0 8px 22px rgba(60,90,100,.08);}
  body.calm .scene{box-shadow:none;}
  .sceneTop{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .sceneTop .ic{width:40px;height:40px;border-radius:12px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;}
  .sceneTop b{font-size:19px;font-weight:900;}
  .back{margin-left:auto;border:2px solid var(--btnbd);background:var(--btn);border-radius:14px;
    padding:8px 12px;font-size:15px;font-weight:700;cursor:pointer;min-height:44px;color:var(--ink);}
  .chips{display:flex;gap:6px;margin:2px 0 12px;flex-wrap:wrap;}
  .chip{font-size:14px;font-weight:800;padding:6px 12px;border-radius:20px;background:#eef3f4;color:var(--soft);border:2px solid transparent;}
  .chip.cur{background:var(--focus);color:#fff;}
  .chip.dn{background:var(--okbg);color:var(--ok);}

  .guide{display:flex;gap:10px;align-items:flex-start;background:#f3faf9;border:2px solid #d5ecea;
    border-radius:16px;padding:12px;margin-bottom:12px;}
  body.calm .guide{background:#f3f6f6;border-color:#e0e6e6;}
  .guide .star{font-size:30px;line-height:1;}
  body:not(.calm) .guide .star{animation:bob 2.4s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .guide .bub{flex:1;font-size:17.5px;font-weight:600;}
  .sayBtn{border:none;background:#dff1ef;color:var(--g1);border-radius:12px;width:44px;height:44px;
    font-size:20px;cursor:pointer;flex:0 0 auto;}
  body.calm .sayBtn{background:#e7eeee;color:#5b8f8c;}

  .stage{margin:6px 0 14px;display:flex;justify-content:center;}
  .qtext{font-size:22px;font-weight:800;text-align:center;margin:6px 0 14px;}

  .opts{display:grid;gap:12px;}
  .opt{display:flex;align-items:center;gap:10px;border:3px solid var(--btnbd);background:#fbfdfd;
    border-radius:18px;padding:16px 16px;font-size:21px;font-weight:800;cursor:pointer;min-height:60px;
    text-align:left;color:var(--ink);width:100%;transition:transform .1s;}
  .opt:hover{border-color:var(--focus);}
  .opt .lab{flex:1;}
  .opt .spk{background:transparent;border:none;font-size:20px;cursor:pointer;color:var(--soft);padding:4px;}
  .opt.right{border-color:var(--ok);background:var(--okbg);color:var(--ok);}
  .opt.wrong{border-color:var(--warn);background:var(--warnbg);color:var(--warn);}
  body:not(.calm) .opt.wrong{animation:wob .4s;}
  @keyframes wob{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .opt[disabled]{cursor:default;}

  .hint{margin-top:12px;background:#fff7ec;border:2px dashed #eac489;border-radius:14px;
    padding:12px 14px;font-size:17px;font-weight:600;color:#8a5a1c;display:none;}
  .hint.show{display:block;}
  .hint b{color:var(--warn);}

  .go{display:block;width:100%;margin-top:16px;border:none;border-radius:18px;padding:16px;
    font-size:21px;font-weight:900;color:#fff;background:var(--ok);cursor:pointer;min-height:62px;}
  .go.big{background:linear-gradient(90deg,var(--g1),var(--g2));}
  body.calm .go.big{background:#5b8f8c;}
  .go.watch{background:var(--focus);}

  .progressDots{display:flex;gap:7px;justify-content:center;margin-bottom:10px;}
  .progressDots span{width:12px;height:12px;border-radius:50%;background:#dbe4e6;}
  .progressDots span.cur{background:var(--focus);transform:scale(1.25);}
  .progressDots span.f{background:var(--ok);}

  /* 乘法視覺元件 */
  .symbig{font-size:66px;font-weight:900;text-align:center;line-height:1;color:var(--g2);}
  .symcap{text-align:center;color:var(--soft);font-size:15px;margin-top:4px;font-weight:700;}

  .eq{font-size:34px;font-weight:900;text-align:center;font-variant-numeric:tabular-nums;line-height:1.5;}
  .eq .z{color:var(--g3);}
  .eq .x{color:var(--g2);}
  .eqsmall{font-size:26px;color:var(--soft);}
  .note0{color:var(--g3);font-size:15px;text-align:center;font-weight:800;margin-top:2px;}

  .mcol{display:inline-flex;flex-direction:column;align-items:flex-end;font-weight:900;
    font-variant-numeric:tabular-nums;font-size:30px;line-height:1.35;background:#fbfdfd;
    border:2px solid var(--line);border-radius:14px;padding:12px 22px 12px 44px;}
  .mcol .op{align-self:flex-start;margin-right:8px;color:var(--g2);}
  .mcol .rule{border-top:3px solid var(--ink);width:100%;margin:3px 0;}
  .mcol .ans{color:var(--g1);}
  .pp{display:flex;flex-direction:column;gap:2px;align-items:flex-end;margin-top:2px;}
  .pp .row{display:flex;align-items:center;gap:10px;}
  .pp .lab{font-size:14px;color:var(--soft);font-weight:800;}
  .pp .v1{color:var(--g1);} .pp .v2{color:var(--g2);}

  .groups{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:520px;}
  .grp{border:2px solid var(--g2);border-radius:10px;padding:6px 10px;font-weight:900;color:var(--g2);font-size:17px;background:#f4f0fc;}

  .celebrate{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden;}
  .conf{position:absolute;top:-20px;font-size:22px;animation:fall 2.2s linear forwards;}
  @keyframes fall{to{transform:translateY(105vh) rotate(360deg);opacity:.2;}}

  .foot{text-align:center;color:var(--soft);font-size:13px;margin-top:20px;line-height:1.8;}
  .hidden{display:none !important;}

  @media (prefers-reduced-motion: reduce){ *{animation:none !important;transition:none !important;} }
</style>

  <h1 class="title">《整數的乘法》大探險</h1>

  <div id="app"></div>

  <div class="foot">
    做完一關會蓋一個勾勾。做到哪裡都會自動存起來，下次打開接著玩。<br>

<script>
"use strict";

/* ============ 視覺元件 ============ */
const V = {
  sym(){ return `<div><div class="symbig">×</div><div class="symcap">乘　幾組　幾倍　共</div></div>`; },
  eq(html, note){ return `<div class="eq">${html}</div>`+(note?`<div class="note0">${note}</div>`:""); },
  groups(n, each){
    let g=""; for(let i=0;i<n;i++) g+=`<div class="grp">${each}</div>`;
    return `<div><div class="groups">${g}</div><div class="note0">${n} 組 ${each}</div></div>`;
  },
  mcol(a,b,ans){   // 直式：a × b = ans
    return `<div class="mcol"><span>${a}</span>`+
           `<span><span class="op">×</span>${b}</span>`+
           `<span class="rule"></span><span class="ans">${ans}</span></div>`;
  },
  mcol2(a,b,p1,p2,ans,l1,l2){  // 部分積直式
    return `<div class="mcol"><span>${a}</span>`+
      `<span><span class="op">×</span>${b}</span><span class="rule"></span>`+
      `<div class="pp"><div class="row"><span class="lab">${l1}</span><span class="v1">${p1}</span></div>`+
      `<div class="row"><span class="lab">${l2}</span><span class="v2">${p2}</span></div></div>`+
      `<span class="rule"></span><span class="ans">${ans}</span></div>`;
  }
};

/* ============ 內容 ============ */
const SCENES = [
  /* ===== 關 1：四位數 × 一位數 ===== */
  { id:1, icon:"🪄", title:"補0魔法", cls:"g1", sub:"四位數 × 一位數",
    layers:[
      { kind:"watch", label:"我看",
        steps:[
          { say:"先認符號。乘號是幾組、幾倍、共。60 乘 4，就是 4 組 60 合起來。",
            html:`<div style="display:flex;gap:24px;align-items:center;justify-content:center">${V.sym()}${V.groups(4,"60")}</div>` },
          { say:"補0魔法。整十整百整千相乘，先把前面的數字乘好，再把 0 補回去。",
            html:`<div>${V.eq(`6 <span class="x">×</span> 4 = 24`)}
                  ${V.eq(`6<span class="z">0</span> <span class="x">×</span> 4 = 24<span class="z">0</span>`,"補 1 個 0")}
                  ${V.eq(`6<span class="z">000</span> <span class="x">×</span> 4 = 24<span class="z">000</span>`,"補 3 個 0")}</div>` },
          { say:"四位數乘一位數，用直式從個位開始，一位一位往上乘。1164 乘 3 等於 3492。",
            html: V.mcol("1164","3","3492") }
        ]},
      { kind:"quiz", label:"我懂",
        items:[
          { say:"用補0魔法。2 乘 6 等於 12，那 20 乘 6 是多少？",
            html: V.eq(`2<span class="z">0</span> <span class="x">×</span> 6 = ?`,"先算 2×6=12，再補 0"),
            q:"20 × 6 ＝？", choices:[["120","一百二十"],["126","一百二十六"],["1200","一千二百"]], ans:0,
            hint:"2 乘 6 是 12，20 後面補 1 個 0，就是 120。" },
          { say:"再一次。200 乘 6 是多少？",
            html: V.eq(`2<span class="z">00</span> <span class="x">×</span> 6 = ?`,"補 2 個 0"),
            q:"200 × 6 ＝？", choices:[["1200","一千二百"],["1206","一千二百零六"],["12000","一萬二千"]], ans:0,
            hint:"2 乘 6 是 12，200 後面補 2 個 0，就是 1200。" }
        ]},
      { kind:"quiz", label:"我做",
        items:[
          { say:"3000 乘 6 是多少？",
            html: V.eq(`3<span class="z">000</span> <span class="x">×</span> 6 = ?`,"3×6=18，補 3 個 0"),
            q:"3000 × 6 ＝？", choices:[["18000","一萬八千"],["1800","一千八百"],["180000","十八萬"]], ans:0,
            hint:"3 乘 6 是 18，3000 後面補 3 個 0，就是 18000。" },
          { say:"用直式算。1164 乘 3 等於多少？",
            html: V.mcol("1164","3","？"),
            q:"1164 × 3 ＝？", choices:[["3492",""],["3482",""],["3392",""]], ans:0,
            hint:"個位 4×3=12 寫 2 進 1，十位 6×3=18 加 1 是 19 寫 9 進 1，答案 3492。" }
        ]},
      { kind:"quiz", label:"我會",
        items:[
          { say:"讀讀看。媽媽到銀行領錢，領了 5 張 2000 元，共領多少元？",
            html: V.eq(`2000 <span class="x">×</span> 5 = ?`,"5 張 → 用乘"),
            q:"共領多少元？", choices:[["10000","一萬元"],["1000","一千元"],["12000","一萬二千元"]], ans:0,
            hint:"2 乘 5 是 10，2000 補 3 個 0，是 10000 元。" },
          { say:"一桶葵花油 5000 毫升，8 桶相同的油共多少毫升？",
            html: V.eq(`5000 <span class="x">×</span> 8 = ?`,"8 桶 → 用乘"),
            q:"共多少毫升？", choices:[["40000","四萬毫升"],["4000","四千毫升"],["45000","四萬五千毫升"]], ans:0,
            hint:"5 乘 8 是 40，5000 補 3 個 0，是 40000 毫升。" },
          { say:"想一想。太陽歌劇每一場門票有 3866 張，4 場最多可賣幾張？",
            html: V.mcol("3866","4","？"),
            q:"4 場共幾張？", choices:[["15464",""],["15446",""],["14464",""]], ans:0,
            hint:"3866 乘 4：個位 6×4=24 寫 4 進 2，一路算下去是 15464 張。" }
        ]}
    ]},

  /* ===== 關 2：一、二位數 × 二位數 ===== */
  { id:2, icon:"🧩", title:"拆解術", cls:"g2", sub:"一、二位數 × 二位數",
    layers:[
      { kind:"watch", label:"我看",
        steps:[
          { say:"乘以整十，也用補0魔法。7 乘 10 是 70，7 乘 20 是 140，7 乘 30 是 210。",
            html:`<div>${V.eq(`7 <span class="x">×</span> 10 = 7<span class="z">0</span>`)}
                  ${V.eq(`7 <span class="x">×</span> 20 = 14<span class="z">0</span>`)}
                  ${V.eq(`7 <span class="x">×</span> 30 = 21<span class="z">0</span>`)}</div>` },
          { say:"二位數乘二位數的祕訣，是把乘數拆成幾個十和幾個一，分別乘，再加起來。",
            html: V.mcol2("46","27","322","920","1242","46×7","46×20") },
          { say:"46 乘 27，就是 46 乘 7 得 322，加上 46 乘 20 得 920，合起來是 1242。",
            html: V.eq(`322 <span class="x">+</span> 920 = 1242`) }
        ]},
      { kind:"quiz", label:"我懂",
        items:[
          { say:"乘以整十。60 乘 20 是多少？",
            html: V.eq(`60 <span class="x">×</span> 20 = ?`,"6×2=12，補 2 個 0"),
            q:"60 × 20 ＝？", choices:[["1200","一千二百"],["120","一百二十"],["12000","一萬二千"]], ans:0,
            hint:"6 乘 2 是 12，兩個數各有 1 個 0，補 2 個 0，是 1200。" },
          { say:"70 乘 20 是多少？",

/* ============ 狀態與存檔 ============ */
const KEY = "sped_math_multiplication_v1";
let prog = { guan:[], calm:false, speak:true };
try{ const s=localStorage.getItem(KEY); if(s) prog=Object.assign(prog, JSON.parse(s)); }catch(e){}
while(prog.guan.length < SCENES.length) prog.guan.push(0);
prog.guan = prog.guan.slice(0, SCENES.length);
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(prog)); }catch(e){} }

let view="map", gi=0, li=0, ii=0, answered=false;
const app=document.getElementById("app");

/* ============ 語音 ============ */
let zhVoice=null;
function pickVoice(){
  const vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  zhVoice = vs.find(v=>/zh[-_]TW/i.test(v.lang)) || vs.find(v=>/zh/i.test(v.lang)) || null;
}
if(window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function speak(t){
  if(!prog.speak || !t || !window.speechSynthesis) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(String(t).replace(/×/g,"乘").replace(/＋/g,"加").replace(/○/g,"對").replace(/✕/g,"不對").replace(/\?/g,""));
    u.lang="zh-TW"; u.rate=.92; u.pitch=1.02; if(zhVoice)u.voice=zhVoice;
    speechSynthesis.speak(u);
  }catch(e){}
}
function stopSpeak(){ if(window.speechSynthesis) try{speechSynthesis.cancel();}catch(e){} }

/* ============ 慶祝 ============ */
function party(){
  if(prog.calm) return;
  const box=document.getElementById("celebrate");
  box.classList.remove("hidden"); box.innerHTML="";
  const em=["⭐","🎉","✨","🌟","💫"];
  for(let i=0;i<24;i++){
    const s=document.createElement("div"); s.className="conf"; s.textContent=em[i%em.length];
    s.style.left=(Math.random()*100)+"%"; s.style.animationDelay=(Math.random()*.5)+"s";
    s.style.fontSize=(18+Math.random()*16)+"px"; box.appendChild(s);
  }
  setTimeout(()=>{box.classList.add("hidden");box.innerHTML="";},2400);
}

/* ============ 畫面 ============ */
function totalLayers(){ return SCENES.length*4; }
function doneLayers(){ return prog.guan.reduce((a,b)=>a+b,0); }
function guanUnlocked(g){ return g===0 || prog.guan[g-1]>=4; }

function render(){ if(view==="map") renderMap(); else renderScene(); updateCtrl(); }
function updateCtrl(){
  document.body.classList.toggle("calm", prog.calm);
  document.getElementById("btnCalm").classList.toggle("on", prog.calm);
  const bs=document.getElementById("btnSpeak");
  bs.classList.toggle("on", prog.speak);
  bs.textContent = prog.speak ? "🔊 朗讀：開" : "🔇 朗讀：關";
}

function renderMap(){
  const pct=Math.round(doneLayers()/totalLayers()*100);
  let sts="";
  SCENES.forEach((s,g)=>{
    const lock=!guanUnlocked(g), done=prog.guan[g]>=4;
    let dots=""; for(let k=0;k<4;k++) dots+=`<span class="${k<prog.guan[g]?"f":""}"></span>`;
    sts+=`<button class="st ${s.cls} ${lock?"lock":""}" data-act="${lock?"":"open"}" data-g="${g}">
      <span class="ic">${lock?"🔒":s.icon}</span>
      <span class="tx"><b>第 ${s.id} 關　${s.title}</b><small>${s.sub}</small>
        <span class="dots">${dots}</span></span>
      <span class="flag">${done?"✅":(lock?"":"▶")}</span></button>`;
  });
  app.innerHTML=`
    <div class="map">
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="guide"><span class="star">⭐</span>
        <div class="bub">${doneLayers()===0?"哈囉，我是林老師！乘法一步一步來，老師陪你。點下面亮亮的關卡出發吧。":
          (pct===100?"全部通關了，你把乘法學起來了，太棒了！可以隨時回來複習。":"做得好！接著點亮亮的關卡繼續喔。")}</div>
        <button class="sayBtn" data-act="say" data-text="哈囉，我是林老師，乘法一步一步來，我陪你。點亮亮的關卡出發吧。">🔊</button></div>
      <div class="stations">${sts}</div>
    </div>`;
}

function renderScene(){
  const s=SCENES[gi], layer=s.layers[li];
  let chips="";
  s.layers.forEach((L,k)=>{
    const cls=k<prog.guan[gi]?"dn":(k===li?"cur":"");
    chips+=`<span class="chip ${cls}">${L.label}${k<prog.guan[gi]?" ✓":""}</span>`;
  });

  let body="";
  if(layer.kind==="watch"){
    const st=layer.steps[ii], last=ii===layer.steps.length-1;
    body=`<div class="guide"><span class="star">⭐</span><div class="bub">${st.say}</div>
        <button class="sayBtn" data-act="say" data-text="${esc(st.say)}">🔊</button></div>
      <div class="stage">${st.html}</div>
      ${last?`<button class="go watch" data-act="watchdone">我看懂了，往下 ▶</button>`
            :`<button class="go watch" data-act="watchnext">繼續看 ▶</button>`}`;
  }else{
    const it=layer.items[ii];
    let dots=""; layer.items.forEach((_,k)=> dots+=`<span class="${k<ii?"f":(k===ii?"cur":"")}"></span>`);
    let opts="";
    it.choices.forEach((c,k)=>{
      const lab=c[1]?c[1]:c[0];
      opts+=`<button class="opt" data-act="ans" data-k="${k}">
        <span class="lab">${lab}</span>
        <button class="spk" data-act="say" data-text="${esc(lab)}">🔊</button></button>`;
    });
    body=`<div class="progressDots">${dots}</div>
      <div class="guide"><span class="star">⭐</span><div class="bub">${it.say}</div>
        <button class="sayBtn" data-act="say" data-text="${esc(it.say)}">🔊</button></div>
      <div class="stage">${it.html}</div>
      <div class="qtext">${it.q}</div>
      <div class="opts">${opts}</div>
      <div class="hint" id="hintBox"><b>小提示：</b>${it.hint}</div>
      <button class="go big hidden" id="nextBtn" data-act="next">做對了，繼續 ▶</button>`;
  }

  app.innerHTML=`
    <div class="scene">
      <div class="sceneTop">
        <span class="ic" style="background:var(--${s.cls})">${s.icon}</span>
        <b>第 ${s.id} 關　${s.title}</b>
        <button class="back" data-act="map">🗺️ 地圖</button>
      </div>
      <div class="chips">${chips}</div>
      ${body}
    </div>`;

  answered=false;
  const sayText = layer.kind==="watch" ? layer.steps[ii].say : layer.items[ii].say;
  setTimeout(()=>speak(sayText),260);
}

function esc(t){ return String(t).replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }

/* ============ 互動 ============ */
function openGuan(g){ gi=g; li=Math.min(prog.guan[g],3); ii=0; view="scene"; render(); }
function completeLayer(){
  if(prog.guan[gi] < li+1){ prog.guan[gi]=li+1; save(); }
  if(li>=3){ stopSpeak(); party(); setTimeout(()=>speak("這一關全部完成，你好棒！"),200); view="map"; render(); }
  else { li+=1; ii=0; render(); }
}
function onAnswer(k){
  const layer=SCENES[gi].layers[li], it=layer.items[ii];
  const btns=[...app.querySelectorAll(".opt")], target=btns[k];
  if(answered) return;
  if(k===it.ans){
    answered=true; target.classList.add("right");
    target.querySelector(".lab").insertAdjacentHTML("beforeend"," ⭐");
    btns.forEach(b=>b.setAttribute("disabled","1"));
    const praise=["答對了，你好棒！","太厲害了，就是這樣！","你自己算出來了！","完全正確！"][Math.floor(Math.random()*4)];
    stopSpeak(); setTimeout(()=>speak(praise),120);
    const nb=document.getElementById("nextBtn"); nb.classList.remove("hidden");
    nb.textContent=(ii>=layer.items.length-1)?"這一層完成 ▶":"做對了，繼續 ▶";
  }else{
    target.classList.add("wrong"); setTimeout(()=>target.classList.remove("wrong"),700);
    document.getElementById("hintBox").classList.add("show");
    stopSpeak(); setTimeout(()=>speak("沒關係，再想一想。"+it.hint),120);
  }
}
function nextItem(){
  const layer=SCENES[gi].layers[li];
  if(ii>=layer.items.length-1) completeLayer(); else { ii+=1; render(); }
}

/* ============ 事件委派 ============ */
document.body.addEventListener("click",(e)=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  const act=b.dataset.act;
  if(act==="say"){ e.stopPropagation(); speak(b.dataset.text); return; }
  if(act==="calm"){ prog.calm=!prog.calm; save(); render(); return; }
  if(act==="speak"){ prog.speak=!prog.speak; save(); if(!prog.speak) stopSpeak(); updateCtrl(); return; }
  if(act==="restart"){ if(confirm("要把進度全部清掉，從第一關重新開始嗎？")){ prog.guan=SCENES.map(()=>0); save(); view="map"; stopSpeak(); render(); } return; }
  if(act==="open"){ openGuan(parseInt(b.dataset.g,10)); return; }
  if(act==="map"){ view="map"; stopSpeak(); render(); return; }
  if(act==="watchnext"){ ii+=1; render(); return; }
  if(act==="watchdone"){ completeLayer(); return; }
  if(act==="ans"){ onAnswer(parseInt(b.dataset.k,10)); return; }
  if(act==="next"){ nextItem(); return; }
});

render();
</script>

(function(){
  function fit(){
    var nav=document.getElementById('jiang-nav'); if(!nav) return;
    var h=nav.offsetHeight||0;
    document.documentElement.style.setProperty('--jnav-h', h+'px');
    try{ document.documentElement.style.scrollPaddingTop=h+'px'; }catch(e){}
    var tb=document.querySelector('.toolbar'); /* 評量頁既有列印工具列 */
    if(tb){ tb.style.top=h+'px'; }
  }
  if(document.readyState!=='loading') fit(); else document.addEventListener('DOMContentLoaded',fit);
  window.addEventListener('load',fit); window.addEventListener('resize',fit);
})();
</script>
