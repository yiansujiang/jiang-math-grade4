<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">

<title>《角度大探險》</title>
<style>
  :root{
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    --bg1:#eaf6f6; --bg2:#f6efe6; --ink:#243b48; --soft:#5b6f7a;
    --card:#ffffff; --line:#d7e3e6;
    --g1:#0f9e99; --g2:#7b5fd0; --g3:#e0912f; --g4:#e0658a;
    --ok:#2f9e6f; --okbg:#e5f6ee; --warn:#e07b3a; --warnbg:#fdefe3;
    --btn:#f2f8f8; --btnbd:#bfd7da; --focus:var(--g1);
    --fs:20px; --radius:22px;
  }
  *{box-sizing:inherit;}
  html,body{margin:0;padding:0;}
  body{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
    color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));
    min-height:100vh;font-size:var(--fs);line-height:1.7;-webkit-text-size-adjust:100%;letter-spacing:.3px;}
  body.calm{background:#f4f6f6;}
  .wrap{max-width:820px;margin:0 auto;padding:12px 16px 60px;}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 4px;}
  .brand .dot{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 32% 30%,#8fd6d2,var(--g1));
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px;box-shadow:0 2px 6px rgba(15,158,153,.35);}
  body.calm .brand .dot{background:#7fb3b0;box-shadow:none;}
  .brand b{font-size:15px;color:var(--soft);font-weight:700;letter-spacing:1px;}
  .ctrl{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 10px;}
  .ctrl button{border:2px solid var(--btnbd);background:var(--btn);color:var(--ink);border-radius:16px;
    padding:8px 12px;font-size:15px;font-weight:700;cursor:pointer;min-height:44px;}
  .ctrl button.on{background:var(--g1);color:#fff;border-color:var(--g1);}
  body.calm .ctrl button.on{background:#5b8f8c;border-color:#5b8f8c;}
  h1.title{font-size:27px;margin:6px 0 2px;text-align:center;font-weight:900;letter-spacing:2px;}
  .subtitle{text-align:center;color:var(--soft);font-size:15px;margin:0 0 14px;}
  .map{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:16px 14px;box-shadow:0 8px 22px rgba(60,90,100,.08);}
  body.calm .map{box-shadow:none;}
  .bar{height:14px;background:#e9eef0;border-radius:20px;overflow:hidden;margin:4px 0 16px;}
  .bar > i{display:block;height:100%;width:0;border-radius:20px;background:linear-gradient(90deg,var(--g1),var(--g2));transition:width .5s ease;}
  body.calm .bar > i{background:#6aa9a5;transition:none;}
  .stations{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:520px){.stations{grid-template-columns:1fr;}}
  .st{display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-radius:18px;padding:12px;background:#fbfdfd;cursor:pointer;text-align:left;transition:transform .12s;}
  .st:not(.lock):hover{transform:translateY(-2px);}
  body.calm .st:hover{transform:none;}
  .st .ic{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;flex:0 0 auto;color:#fff;}
  .st.g1 .ic{background:var(--g1);} .st.g2 .ic{background:var(--g2);} .st.g3 .ic{background:var(--g3);} .st.g4 .ic{background:var(--g4);}
  body.calm .st .ic{filter:saturate(.6);}
  .st .tx{flex:1;min-width:0;}
  .st .tx b{display:block;font-size:18px;font-weight:800;}
  .st .tx small{color:var(--soft);font-size:13.5px;}
  .st .flag{font-size:22px;flex:0 0 auto;}
  .st.lock{opacity:.5;cursor:not-allowed;background:#f1f3f4;}
  .st .dots{display:flex;gap:4px;margin-top:4px;}
  .st .dots span{width:9px;height:9px;border-radius:50%;background:#dbe4e6;}
  .st .dots span.f{background:var(--ok);}
  .scene{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:16px 16px 20px;box-shadow:0 8px 22px rgba(60,90,100,.08);}
  body.calm .scene{box-shadow:none;}
  .sceneTop{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .sceneTop .ic{width:40px;height:40px;border-radius:12px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;}
  .sceneTop b{font-size:19px;font-weight:900;}
  .back{margin-left:auto;border:2px solid var(--btnbd);background:var(--btn);border-radius:14px;padding:8px 12px;font-size:15px;font-weight:700;cursor:pointer;min-height:44px;color:var(--ink);}
  .chips{display:flex;gap:6px;margin:2px 0 12px;flex-wrap:wrap;}
  .chip{font-size:14px;font-weight:800;padding:6px 12px;border-radius:20px;background:#eef3f4;color:var(--soft);border:2px solid transparent;}
  .chip.cur{background:var(--focus);color:#fff;} .chip.dn{background:var(--okbg);color:var(--ok);}
  .guide{display:flex;gap:10px;align-items:flex-start;background:#f3faf9;border:2px solid #d5ecea;border-radius:16px;padding:12px;margin-bottom:12px;}
  body.calm .guide{background:#f3f6f6;border-color:#e0e6e6;}
  .guide .star{font-size:30px;line-height:1;}
  body:not(.calm) .guide .star{animation:bob 2.4s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .guide .bub{flex:1;font-size:17.5px;font-weight:600;}
  .sayBtn{border:none;background:#dff1ef;color:var(--g1);border-radius:12px;width:44px;height:44px;font-size:20px;cursor:pointer;flex:0 0 auto;}
  body.calm .sayBtn{background:#e7eeee;color:#5b8f8c;}
  .stage{margin:6px 0 14px;display:flex;justify-content:center;}
  .qtext{font-size:22px;font-weight:800;text-align:center;margin:6px 0 14px;}
  .opts{display:grid;gap:12px;}
  .opt{display:flex;align-items:center;gap:10px;border:3px solid var(--btnbd);background:#fbfdfd;border-radius:18px;padding:16px 16px;font-size:21px;font-weight:800;cursor:pointer;min-height:60px;text-align:left;color:var(--ink);width:100%;transition:transform .1s;}
  .opt:hover{border-color:var(--focus);}
  .opt .lab{flex:1;}
  .opt .spk{background:transparent;border:none;font-size:20px;cursor:pointer;color:var(--soft);padding:4px;}
  .opt.right{border-color:var(--ok);background:var(--okbg);color:var(--ok);}
  .opt.wrong{border-color:var(--warn);background:var(--warnbg);color:var(--warn);}
  body:not(.calm) .opt.wrong{animation:wob .4s;}
  @keyframes wob{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .opt[disabled]{cursor:default;}
  .hint{margin-top:12px;background:#fff7ec;border:2px dashed #eac489;border-radius:14px;padding:12px 14px;font-size:17px;font-weight:600;color:#8a5a1c;display:none;}
  .hint.show{display:block;}
  .hint b{color:var(--warn);}
  .go{display:block;width:100%;margin-top:16px;border:none;border-radius:18px;padding:16px;font-size:21px;font-weight:900;color:#fff;background:var(--ok);cursor:pointer;min-height:62px;}
  .go.big{background:linear-gradient(90deg,var(--g1),var(--g2));}
  body.calm .go.big{background:#5b8f8c;}
  .go.watch{background:var(--focus);}
  .progressDots{display:flex;gap:7px;justify-content:center;margin-bottom:10px;}
  .progressDots span{width:12px;height:12px;border-radius:50%;background:#dbe4e6;}
  .progressDots span.cur{background:var(--focus);transform:scale(1.25);}
  .progressDots span.f{background:var(--ok);}
  .eq{font-size:32px;font-weight:900;text-align:center;font-variant-numeric:tabular-nums;line-height:1.5;}
  .eq .x{color:var(--g2);} .eq .p{color:var(--ok);} .eq .m{color:var(--g4);}
  .note0{color:var(--g3);font-size:15px;text-align:center;font-weight:800;margin-top:2px;}
  .symbig{font-size:60px;font-weight:900;text-align:center;line-height:1;}
  .symbig.plus{color:var(--ok);} .symbig.minus{color:var(--g4);}
  .symcap{text-align:center;color:var(--soft);font-size:15px;margin-top:2px;font-weight:700;}
  .angleTypes{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
  .celebrate{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden;}
  .conf{position:absolute;top:-20px;font-size:22px;animation:fall 2.2s linear forwards;}
  @keyframes fall{to{transform:translateY(105vh) rotate(360deg);opacity:.2;}}
  .foot{text-align:center;color:var(--soft);font-size:13px;margin-top:20px;line-height:1.8;}
  .hidden{display:none !important;}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important;transition:none !important;} }
</style>

<script>
"use strict";

/* ============ SVG 視覺元件 ============ */
const V = {
  rad(d){ return d*Math.PI/180; },
  protractor(theta, start, opts){
    opts=opts||{}; start=start||"right";
    const W=340,H=210,cx=170,cy=185,R=150;
    const px=(r,phi)=> (cx + r*Math.cos(V.rad(phi))).toFixed(1);
    const py=(r,phi)=> (cy - r*Math.sin(V.rad(phi))).toFixed(1);
    let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:360px" xmlns="http://www.w3.org/2000/svg">`;
    // 底盤
    let arc=""; for(let d=0; d<=180; d+=2) arc+=`${px(R,d)},${py(R,d)} `;
    s+=`<polygon points="${cx-R},${cy} ${arc} ${cx+R},${cy}" fill="#eef6f8" stroke="#8aa6ad" stroke-width="2"/>`;
    s+=`<line x1="${cx-R}" y1="${cy}" x2="${cx+R}" y2="${cy}" stroke="#8aa6ad" stroke-width="2"/>`;
    // 刻度
    for(let d=0; d<=180; d+=5){
      const major=d%10===0, len=major?12:7;
      s+=`<line x1="${px(R,d)}" y1="${py(R,d)}" x2="${px(R-len,d)}" y2="${py(R-len,d)}" stroke="#7d97a0" stroke-width="${major?1.5:1}"/>`;
    }
    // 內外圈數字（外圈=物理角，內圈=180減；作用中的那圈加粗）
    const boldOuter = (start!=="left");
    for(let d=0; d<=180; d+=10){
      s+=`<text x="${px(R-24,d)}" y="${py(R-24,d)}" font-size="11" text-anchor="middle" dominant-baseline="middle" fill="${boldOuter?'#243b48':'#c2ccd0'}" font-weight="${boldOuter?'800':'500'}">${d}</text>`;
      s+=`<text x="${px(R-40,d)}" y="${py(R-40,d)}" font-size="10" text-anchor="middle" dominant-baseline="middle" fill="${boldOuter?'#e4a9b0':'#d0656f'}" font-weight="${boldOuter?'500':'800'}">${180-d}</text>`;
    }
    if(theta!=null){
      const phiFixed = (start==="left")?180:0;
      const phiMove  = (start==="left")?(180-theta):theta;
      // 扇形（多邊形近似，避免弧線旗標問題）
      let pts=`${cx},${cy} `; const stp=phiFixed<phiMove?2:-2;
      for(let d=phiFixed; (stp>0? d<=phiMove : d>=phiMove); d+=stp) pts+=`${px(R-6,d)},${py(R-6,d)} `;
      pts+=`${px(R-6,phiMove)},${py(R-6,phiMove)}`;
      s+=`<polygon points="${pts}" fill="rgba(123,95,208,.16)"/>`;
      s+=`<line x1="${cx}" y1="${cy}" x2="${px(R,phiFixed)}" y2="${py(R,phiFixed)}" stroke="#2f9e6f" stroke-width="3.5"/>`;
      s+=`<line x1="${cx}" y1="${cy}" x2="${px(R,phiMove)}" y2="${py(R,phiMove)}" stroke="#7b5fd0" stroke-width="3.5"/>`;
      s+=`<circle cx="${px(R,phiFixed)}" cy="${py(R,phiFixed)}" r="6" fill="#2f9e6f"/>`;
      s+=`<text x="${px(R,phiFixed)}" y="${cy+19}" font-size="12" text-anchor="middle" fill="#2f9e6f" font-weight="800">0 起點</text>`;
      if(opts.showRead){
        s+=`<circle cx="${px(R-24,phiMove)}" cy="${py(R-24,phiMove)}" r="13" fill="none" stroke="#e0912f" stroke-width="2.6"/>`;
        s+=`<text x="${px(R+10,phiMove)}" y="${py(R+10,phiMove)}" font-size="16" text-anchor="middle" fill="#e0912f" font-weight="900">${theta}°</text>`;
      }
    }
    s+=`<circle cx="${cx}" cy="${cy}" r="4.5" fill="#243b48"/>`;
    s+=`</svg>`;
    return s;
  },
  clock(toN, dir){   // 起點固定為 12
    const W=210,H=210,cx=105,cy=105,R=88;
    const pos=(n,r)=>{ const a=V.rad(90-(n%12)*30); return [ (cx+r*Math.cos(a)).toFixed(1), (cy-r*Math.sin(a)).toFixed(1) ]; };
    let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:230px" xmlns="http://www.w3.org/2000/svg">`;
    s+=`<circle cx="${cx}" cy="${cy}" r="${R+14}" fill="#eef6f8" stroke="#8aa6ad" stroke-width="2.5"/>`;
    for(let n=1;n<=12;n++){ const [x,y]=pos(n,R); s+=`<text x="${x}" y="${+y+5}" font-size="15" text-anchor="middle" fill="#243b48" font-weight="800">${n}</text>`; }
    // 旋轉方向弧線箭頭
    const deg = (dir==="cw" ? ((toN%12)||12) : ((12-(toN%12))%12||12))*30;
    const startA=90, endA = dir==="cw" ? 90-deg : 90+deg, rr=42;
    let ap=""; const st=dir==="cw"?-4:4;
    for(let a=startA; (st<0? a>=endA : a<=endA); a+=st) ap+=`${(cx+rr*Math.cos(V.rad(a))).toFixed(1)},${(cy-rr*Math.sin(V.rad(a))).toFixed(1)} `;
    s+=`<polyline points="${ap}" fill="none" stroke="#e0912f" stroke-width="3"/>`;
    const ex=cx+rr*Math.cos(V.rad(endA)), ey=cy-rr*Math.sin(V.rad(endA));
    s+=`<circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="4.5" fill="#e0912f"/>`;
    // 指針：12（起點，深色）與 toN（終點，粉色）
    const [sx,sy]=pos(12,R-20), [tx,ty]=pos(toN,R-20);
    s+=`<line x1="${cx}" y1="${cy}" x2="${sx}" y2="${sy}" stroke="#243b48" stroke-width="3"/>`;
    s+=`<line x1="${cx}" y1="${cy}" x2="${tx}" y2="${ty}" stroke="#e0658a" stroke-width="3.5"/>`;
    s+=`<circle cx="${cx}" cy="${cy}" r="4.5" fill="#243b48"/>`;
    s+=`</svg>`;
    return s;
  },
  angleSplit(a,b){   // 一個角被中間邊分成 a 與 b
    const W=280,H=160,ox=34,oy=134,R=120;
    const P=(deg,r)=>[ (ox+r*Math.cos(V.rad(deg))).toFixed(1), (oy-r*Math.sin(V.rad(deg))).toFixed(1) ];
    let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:300px" xmlns="http://www.w3.org/2000/svg">`;
    const rays=[0,a,a+b];
    rays.forEach((g,i)=>{ const [x,y]=P(g,R); s+=`<line x1="${ox}" y1="${oy}" x2="${x}" y2="${y}" stroke="#4a6a74" stroke-width="3"/>`; });
    const [la,ly]=P(a/2,64); s+=`<text x="${la}" y="${ly}" font-size="15" text-anchor="middle" fill="#2f9e6f" font-weight="900">${a}°</text>`;
    const [lb,lby]=P(a+b/2,64); s+=`<text x="${lb}" y="${lby}" font-size="15" text-anchor="middle" fill="#7b5fd0" font-weight="900">${b}°</text>`;
    s+=`<circle cx="${ox}" cy="${oy}" r="4" fill="#243b48"/>`;
    s+=`</svg>`;
    return s;
  },
  angleTypes(){
    const one=(deg,name,rng,col)=>{
      const W=120,H=96,ox=18,oy=78,R=86;
      const ex=(ox+R*Math.cos(V.rad(deg))).toFixed(1), ey=(oy-R*Math.sin(V.rad(deg))).toFixed(1);
      return `<div style="text-align:center"><svg viewBox="0 0 ${W} ${H}" width="120" xmlns="http://www.w3.org/2000/svg">`+
        `<line x1="${ox}" y1="${oy}" x2="${ox+R}" y2="${oy}" stroke="#4a6a74" stroke-width="3"/>`+
        `<line x1="${ox}" y1="${oy}" x2="${ex}" y2="${ey}" stroke="${col}" stroke-width="3"/>`+
        `<circle cx="${ox}" cy="${oy}" r="3.5" fill="#243b48"/></svg>`+
        `<div style="font-size:14px;font-weight:900;color:${col}">${name}</div>`+
        `<div style="font-size:12px;color:var(--soft)">${rng}</div></div>`;
    };
    return `<div class="angleTypes">${one(45,"銳角","小於90°","#2f9e6f")}${one(90,"直角","等於90°","#0f9e99")}`+
      `${one(130,"鈍角","90°到180°","#e0912f")}${one(178,"平角","等於180°","#e0658a")}</div>`;
  },
  sym(op){ const plus=op==="＋";
    return `<div><div class="symbig ${plus?"plus":"minus"}">${op}</div><div class="symcap">${plus?"合成　合起來　用加":"分解　拿掉　剩下　用減"}</div></div>`; },
  eq(html,note){ return `<div class="eq">${html}</div>`+(note?`<div class="note0">${note}</div>`:""); }
};

/* ============ 內容 ============ */
const SCENES = [
  { id:1, icon:"📐", title:"認識量角器", cls:"g1", sub:"量角器的認識與報讀",
    layers:[
      { kind:"watch", label:"我看",
        steps:[

          { say:"量角器有兩圈數字。外圈是黑色，內圈是紅色。看角度時，要看你的邊從哪一個 0 開始，就跟著那一圈讀。", html:V.protractor(null) },

      { kind:"quiz", label:"我做",

      { kind:"quiz", label:"我會",
        items:[

            q:"這個角是幾度？", choices:[["60","60 度"],["120","120 度"]], ans:0,

          { say:"再看一個。這個角是幾度？", html:V.protractor(90,"right"),

  { id:2, icon:"🔺", title:"量出幾度", cls:"g2", sub:"讀角度與角的種類",
    layers:[
      { kind:"watch", label:"我看",

          { say:"量角的口訣：一邊對齊 0，另一邊指到的數字就是角度。記得從你的 0 那一圈讀。", html:V.protractor(60,"right",{showRead:true}) },
          { say:"角有四種。小於 90 度是銳角，等於 90 度是直角，90 到 180 度之間是鈍角，等於 180 度是平角。", html:V.angleTypes() }

      { kind:"quiz", label:"我懂",

            hint:"從綠色 0 跟著黑色外圈數，是 30 度。（150 是看成內圈了）" },
          { say:"這個角是幾度？", html:V.protractor(150,"right"),
            q:"這個角是幾度？", choices:[["150","150 度"],["30","30 度"]], ans:0,
            hint:"從綠色 0 跟著黑色外圈數到紫色邊，是 150 度。" }
        ]},
      { kind:"quiz", label:"我做",
        items:[
          { say:"這個角是幾度？", html:V.protractor(105,"right"),
            q:"這個角是幾度？", choices:[["105","105 度"],["75","75 度"]], ans:0,
            hint:"從綠色 0 跟著黑色外圈，紫色邊在 105。" },
          { say:"這個角是幾度？", html:V.protractor(115,"right"),
            q:"這個角是幾度？", choices:[["115","115 度"],["65","65 度"]], ans:0,
            hint:"從綠色 0 跟著黑色外圈，紫色邊在 115。" }
        ]},
      { kind:"quiz", label:"我會",
        items:[
          { say:"60 度是什麼角？想一想，它比 90 度小還是大？", html:V.protractor(60,"right"),
            q:"60 度是什麼角？", choices:[["銳角","銳角（小於90度）"],["直角","直角"],["鈍角","鈍角"]], ans:0,
            hint:"60 比 90 小，小於 90 度的是銳角。" },
          { say:"120 度是什麼角？", html:V.protractor(120,"right"),
            q:"120 度是什麼角？", choices:[["鈍角","鈍角（90到180度）"],["銳角","銳角"],["直角","直角"]], ans:0,
            hint:"120 在 90 和 180 之間，是鈍角。" },
          { say:"想一想。90 度是什麼角？", html:V.protractor(90,"right"),
            q:"90 度是什麼角？", choices:[["直角","直角（等於90度）"],["銳角","銳角"],["鈍角","鈍角"]], ans:0,
            hint:"剛剛好 90 度的，叫直角。" }
        ]}
    ]},

  { id:3, icon:"🕐", title:"時鐘轉幾度", cls:"g3", sub:"旋轉角",
    layers:[
      { kind:"watch", label:"我看",
        steps:[
          { say:"鐘面上有 12 大格。指針轉一圈是 360 度。360 除以 12，所以每 1 大格是 30 度。", html:V.clock(12,"cw") },
          { say:"和時鐘指針同方向轉，叫順時針。相反方向轉，叫逆時針。這是順時針，從 12 轉到 3。", html:V.clock(3,"cw") }
        ]},
      { kind:"quiz", label:"我懂",
        items:[
          { say:"鐘面上每 1 大格是幾度？", html:V.clock(1,"cw"),
            q:"每一大格是幾度？", choices:[["30","30 度"],["10","10 度"],["60","60 度"]], ans:0,
            hint:"一圈 360 度分成 12 大格，360 除以 12 等於 30 度。" },
          { say:"指針從 12 順時針轉到 3，轉了幾大格？", html:V.clock(3,"cw"),
            q:"轉了幾大格？", choices:[["3","3 大格"],["4","4 大格"]], ans:0,
            hint:"12 到 3 經過 1、2、3，是 3 大格。" }
        ]},
      { kind:"quiz", label:"我做",
        items:[
          { say:"從 12 順時針轉到 3，一共轉了幾度？", html:V.clock(3,"cw"),
            q:"轉了幾度？", choices:[["90","90 度"],["60","60 度"],["120","120 度"]], ans:0,
            hint:"3 大格，每格 30 度，3 乘 30 等於 90 度。" },
          { say:"從 12 順時針轉到 4，轉了幾度？", html:V.clock(4,"cw"),
            q:"轉了幾度？", choices:[["120","120 度"],["90","90 度"]], ans:0,
            hint:"4 大格乘 30 度等於 120 度。" }
        ]},
      { kind:"quiz", label:"我會",
        items:[
          { say:"從 12 逆時針轉到 9，轉了幾度？（逆時針是往回轉）", html:V.clock(9,"ccw"),
            q:"逆時針轉了幾度？", choices:[["90","90 度"],["270","270 度"]], ans:0,
            hint:"逆時針 12 到 9 是 3 大格，3 乘 30 等於 90 度。" },
          { say:"這次是順時針，從 12 一路轉到 9，轉了幾度？", html:V.clock(9,"cw"),
            q:"順時針轉了幾度？", choices:[["270","270 度"],["90","90 度"]], ans:0,
            hint:"順時針 12 到 9 要走 9 大格，9 乘 30 等於 270 度。" },
          { say:"想一想。指針轉一整圈是幾度？", html:V.clock(12,"cw"),
            q:"轉一圈是幾度？", choices:[["360","360 度"],["180","180 度"]], ans:0,
            hint:"12 大格乘 30 度等於 360 度，這叫周角。" }
        ]}
    ]},

  { id:4, icon:"🧩", title:"角的合成與分解", cls:"g4", sub:"角度的加與減",
    layers:[
      { kind:"watch", label:"我看",
        steps:[
          { say:"認符號。合成是把兩個角合起來，用加。分解是從一個角拿掉一部分，用減。", html:`<div style="display:flex;gap:26px;justify-content:center">${V.sym("＋")}${V.sym("－")}</div>` },
          { say:"角的合成：把兩個角的度數相加。50 度加 30 度等於 80 度。", html:`<div>${V.angleSplit(50,30)}${V.eq(`50° <span class="p">＋</span> 30° = 80°`)}</div>` },
          { say:"角的分解：用減的。直角 90 度拿掉 50 度，剩下 40 度。", html:V.eq(`90° <span class="m">－</span> 50° = 40°`) }
        ]},
      { kind:"quiz", label:"我懂",
        items:[
          { say:"合起來用加。51 度和 31 度合起來是幾度？", html:V.eq(`51° <span class="p">＋</span> 31° = ?`,"合起來 → 用加"),
            q:"51° ＋ 31° ＝？", choices:[["82","82 度"],["20","20 度"],["81","81 度"]], ans:0,
            hint:"51 加 31，個位 1 加 1 是 2，答案 82 度。" },
          { say:"150 度和 15 度合起來是幾度？", html:V.eq(`150° <span class="p">＋</span> 15° = ?`,"合起來 → 用加"),
            q:"150° ＋ 15° ＝？", choices:[["165","165 度"],["135","135 度"]], ans:0,
            hint:"150 加 15 等於 165 度。" }
        ]},
      { kind:"quiz", label:"我做",
        items:[
          { say:"拿掉用減。直角 90 度拿掉 64 度，剩下幾度？", html:V.eq(`90° <span class="m">－</span> 64° = ?`,"拿掉 → 用減"),
            q:"90° － 64° ＝？", choices:[["26","26 度"],["154","154 度"],["36","36 度"]], ans:0,
            hint:"90 減 64 等於 26 度。" },
          { say:"平角 180 度拿掉 55 度，剩下幾度？", html:V.eq(`180° <span class="m">－</span> 55° = ?`,"拿掉 → 用減"),
            q:"180° － 55° ＝？", choices:[["125","125 度"],["135","135 度"]], ans:0,
            hint:"180 減 55 等於 125 度。" }
        ]},
      { kind:"quiz", label:"我會",
        items:[
          { say:"一個 126 度的角，分成 39 度和另一個角。另一個角是幾度？", html:V.eq(`126° <span class="m">－</span> 39° = ?`,"分解 → 用減"),
            q:"另一個角是幾度？", choices:[["87","87 度"],["165","165 度"]], ans:0,
            hint:"126 減 39 等於 87 度。" },
          { say:"想一想，兩步。45 度加 50 度是 95 度。那平角 180 度拿掉這 95 度，剩下幾度？", html:V.eq(`45°＋50°=95°　　180° <span class="m">－</span> 95° = ?`),
            q:"最後剩下幾度？", choices:[["85","85 度"],["95","95 度"]], ans:0,

        ]}

/* ============ 狀態與存檔 ============ */
const KEY="sped_math_angle_v1";
let prog={ guan:[], calm:false, speak:true };
try{ const s=localStorage.getItem(KEY); if(s) prog=Object.assign(prog, JSON.parse(s)); }catch(e){}
while(prog.guan.length<SCENES.length) prog.guan.push(0);
prog.guan=prog.guan.slice(0,SCENES.length);
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(prog)); }catch(e){} }

let view="map", gi=0, li=0, ii=0, answered=false;
const app=document.getElementById("app");

/* 語音 */
let zhVoice=null;
function pickVoice(){ const vs=window.speechSynthesis?speechSynthesis.getVoices():[]; zhVoice=vs.find(v=>/zh[-_]TW/i.test(v.lang))||vs.find(v=>/zh/i.test(v.lang))||null; }
if(window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function speak(t){ if(!prog.speak||!t||!window.speechSynthesis) return;
  try{ speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(String(t).replace(/°/g,"度").replace(/＋/g,"加").replace(/－/g,"減").replace(/×/g,"乘").replace(/\?/g,""));
    u.lang="zh-TW"; u.rate=.92; u.pitch=1.02; if(zhVoice)u.voice=zhVoice; speechSynthesis.speak(u);
  }catch(e){} }
function stopSpeak(){ if(window.speechSynthesis) try{speechSynthesis.cancel();}catch(e){} }

/* 慶祝 */
function party(){ if(prog.calm) return;
  const box=document.getElementById("celebrate"); box.classList.remove("hidden"); box.innerHTML="";
  const em=["⭐","🎉","✨","🌟","💫"];
  for(let i=0;i<24;i++){ const s=document.createElement("div"); s.className="conf"; s.textContent=em[i%em.length];
    s.style.left=(Math.random()*100)+"%"; s.style.animationDelay=(Math.random()*.5)+"s"; s.style.fontSize=(18+Math.random()*16)+"px"; box.appendChild(s); }
  setTimeout(()=>{box.classList.add("hidden");box.innerHTML="";},2400);
}

/* 畫面 */
function totalLayers(){ return SCENES.length*4; }
function doneLayers(){ return prog.guan.reduce((a,b)=>a+b,0); }
function guanUnlocked(g){ return g===0 || prog.guan[g-1]>=4; }
function render(){ if(view==="map") renderMap(); else renderScene(); updateCtrl(); }
function updateCtrl(){
  document.body.classList.toggle("calm", prog.calm);
  document.getElementById("btnCalm").classList.toggle("on", prog.calm);
  const bs=document.getElementById("btnSpeak"); bs.classList.toggle("on", prog.speak);
  bs.textContent = prog.speak ? "🔊 朗讀：開" : "🔇 朗讀：關";
}
function renderMap(){
  const pct=Math.round(doneLayers()/totalLayers()*100); let sts="";
  SCENES.forEach((s,g)=>{
    const lock=!guanUnlocked(g), done=prog.guan[g]>=4;
    let dots=""; for(let k=0;k<4;k++) dots+=`<span class="${k<prog.guan[g]?"f":""}"></span>`;
    sts+=`<button class="st ${s.cls} ${lock?"lock":""}" data-act="${lock?"":"open"}" data-g="${g}">
      <span class="ic">${lock?"🔒":s.icon}</span>
      <span class="tx"><b>第 ${s.id} 關　${s.title}</b><small>${s.sub}</small><span class="dots">${dots}</span></span>
      <span class="flag">${done?"✅":(lock?"":"▶")}</span></button>`;
  });
  app.innerHTML=`<div class="map"><div class="bar"><i style="width:${pct}%"></i></div>
    <div class="guide"><span class="star">⭐</span>
      <div class="bub">${doneLayers()===0?"哈囉，我是林老師！這一單元我們一起看量角器、讀角度。點下面亮亮的關卡出發吧。":
        (pct===100?"全部通關了，你把角度學起來了，太棒了！可以隨時回來複習。":"做得好！接著點亮亮的關卡繼續喔。")}</div>
      <button class="sayBtn" data-act="say" data-text="哈囉，我是林老師，這一單元我們一起看量角器、讀角度。點亮亮的關卡出發吧。">🔊</button></div>
    <div class="stations">${sts}</div></div>`;
}
function renderScene(){
  const s=SCENES[gi], layer=s.layers[li]; let chips="";
  s.layers.forEach((L,k)=>{ const cls=k<prog.guan[gi]?"dn":(k===li?"cur":""); chips+=`<span class="chip ${cls}">${L.label}${k<prog.guan[gi]?" ✓":""}</span>`; });
  let body="";
  if(layer.kind==="watch"){
    const st=layer.steps[ii], last=ii===layer.steps.length-1;
    body=`<div class="guide"><span class="star">⭐</span><div class="bub">${st.say}</div><button class="sayBtn" data-act="say" data-text="${esc(st.say)}">🔊</button></div>
      <div class="stage">${st.html}</div>
      ${last?`<button class="go watch" data-act="watchdone">我看懂了，往下 ▶</button>`:`<button class="go watch" data-act="watchnext">繼續看 ▶</button>`}`;
  }else{
    const it=layer.items[ii]; let dots=""; layer.items.forEach((_,k)=> dots+=`<span class="${k<ii?"f":(k===ii?"cur":"")}"></span>`);
    let opts=""; it.choices.forEach((c,k)=>{ const lab=c[1]?c[1]:c[0];
      opts+=`<button class="opt" data-act="ans" data-k="${k}"><span class="lab">${lab}</span><button class="spk" data-act="say" data-text="${esc(lab)}">🔊</button></button>`; });
    body=`<div class="progressDots">${dots}</div>
      <div class="guide"><span class="star">⭐</span><div class="bub">${it.say}</div><button class="sayBtn" data-act="say" data-text="${esc(it.say)}">🔊</button></div>
      ${it.html?`<div class="stage">${it.html}</div>`:""}
      <div class="qtext">${it.q}</div><div class="opts">${opts}</div>
      <div class="hint" id="hintBox"><b>小提示：</b>${it.hint}</div>
      <button class="go big hidden" id="nextBtn" data-act="next">做對了，繼續 ▶</button>`;
  }
  app.innerHTML=`<div class="scene"><div class="sceneTop"><span class="ic" style="background:var(--${s.cls})">${s.icon}</span>
    <b>第 ${s.id} 關　${s.title}</b><button class="back" data-act="map">🗺️ 地圖</button></div>
    <div class="chips">${chips}</div>${body}</div>`;
  answered=false;
  const sayText = layer.kind==="watch" ? layer.steps[ii].say : layer.items[ii].say;
  setTimeout(()=>speak(sayText),260);
}
function esc(t){ return String(t).replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }

/* 互動 */
function openGuan(g){ gi=g; li=Math.min(prog.guan[g],3); ii=0; view="scene"; render(); }
function completeLayer(){
  if(prog.guan[gi] < li+1){ prog.guan[gi]=li+1; save(); }
  if(li>=3){ stopSpeak(); party(); setTimeout(()=>speak("這一關全部完成，你好棒！"),200); view="map"; render(); }
  else { li+=1; ii=0; render(); }
}
function onAnswer(k){
  const layer=SCENES[gi].layers[li], it=layer.items[ii];
  const btns=[...app.querySelectorAll(".opt")], target=btns[k]; if(answered) return;
  if(k===it.ans){
    answered=true; target.classList.add("right");
    target.querySelector(".lab").insertAdjacentHTML("beforeend"," ⭐");
    btns.forEach(b=>b.setAttribute("disabled","1"));
    const praise=["答對了，你好棒！","太厲害了，就是這樣！","你自己讀出來了！","完全正確！"][Math.floor(Math.random()*4)];
    stopSpeak(); setTimeout(()=>speak(praise),120);
    const nb=document.getElementById("nextBtn"); nb.classList.remove("hidden");
    nb.textContent=(ii>=layer.items.length-1)?"這一層完成 ▶":"做對了，繼續 ▶";
  }else{
    target.classList.add("wrong"); setTimeout(()=>target.classList.remove("wrong"),700);
    document.getElementById("hintBox").classList.add("show");
    stopSpeak(); setTimeout(()=>speak("沒關係，再想一想。"+it.hint),120);
  }
}
function nextItem(){ const layer=SCENES[gi].layers[li]; if(ii>=layer.items.length-1) completeLayer(); else { ii+=1; render(); } }

document.body.addEventListener("click",(e)=>{
  const b=e.target.closest("[data-act]"); if(!b) return; const act=b.dataset.act;
  if(act==="say"){ e.stopPropagation(); speak(b.dataset.text); return; }
  if(act==="calm"){ prog.calm=!prog.calm; save(); render(); return; }
  if(act==="speak"){ prog.speak=!prog.speak; save(); if(!prog.speak) stopSpeak(); updateCtrl(); return; }
  if(act==="restart"){ if(confirm("要把進度全部清掉，從第一關重新開始嗎？")){ prog.guan=SCENES.map(()=>0); save(); view="map"; stopSpeak(); render(); } return; }
  if(act==="open"){ openGuan(parseInt(b.dataset.g,10)); return; }
  if(act==="map"){ view="map"; stopSpeak(); render(); return; }
  if(act==="watchnext"){ ii+=1; render(); return; }
  if(act==="watchdone"){ completeLayer(); return; }
  if(act==="ans"){ onAnswer(parseInt(b.dataset.k,10)); return; }
  if(act==="next"){ nextItem(); return; }
});
render();
</script>

<script>
(function(){
  function fit(){
    var nav=document.getElementById('jiang-nav'); if(!nav) return;
    var h=nav.offsetHeight||0;
    document.documentElement.style.setProperty('--jnav-h', h+'px');
    try{ document.documentElement.style.scrollPaddingTop=h+'px'; }catch(e){}
    var tb=document.querySelector('.toolbar'); /* 評量頁既有列印工具列 */
    if(tb){ tb.style.top=h+'px'; }
  }
  if(document.readyState!=='loading') fit(); else document.addEventListener('DOMContentLoaded',fit);
  window.addEventListener('load',fit); window.addEventListener('resize',fit);
})();
</script>

</body>
</html>
