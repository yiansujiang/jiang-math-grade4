<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小數大探險</title>
<style>
  :root{
    box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
    --bg1:#eaf6f6; --bg2:#f6efe6; --ink:#243b48; --soft:#5b6f7a; --card:#ffffff; --line:#d7e3e6;
    --g1:#0f9e99; --g2:#7b5fd0; --g3:#e0912f; --g4:#e0658a;
    --ok:#2f9e6f; --okbg:#e5f6ee; --warn:#e07b3a; --warnbg:#fdefe3;
    --btn:#f2f8f8; --btnbd:#bfd7da; --focus:var(--g1); --fs:20px; --radius:22px;
  }
  *{box-sizing:inherit;} html,body{margin:0;padding:0;}
  body{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;color:var(--ink);
    background:linear-gradient(160deg,var(--bg1),var(--bg2));min-height:100vh;font-size:var(--fs);line-height:1.7;-webkit-text-size-adjust:100%;letter-spacing:.3px;}
  body.calm{background:#f4f6f6;}
  .wrap{max-width:820px;margin:0 auto;padding:12px 16px 60px;}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 4px;}
  .brand .dot{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 32% 30%,#8fd6d2,var(--g1));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px;box-shadow:0 2px 6px rgba(15,158,153,.35);}
  body.calm .brand .dot{background:#7fb3b0;box-shadow:none;}
  .brand b{font-size:15px;color:var(--soft);font-weight:700;letter-spacing:1px;}
  .ctrl{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 10px;}
  .ctrl button{border:2px solid var(--btnbd);background:var(--btn);color:var(--ink);border-radius:16px;padding:8px 12px;font-size:15px;font-weight:700;cursor:pointer;min-height:44px;}
  .ctrl button.on{background:var(--g1);color:#fff;border-color:var(--g1);}
  body.calm .ctrl button.on{background:#5b8f8c;border-color:#5b8f8c;}
  h1.title{font-size:27px;margin:6px 0 2px;text-align:center;font-weight:900;letter-spacing:2px;}
  .subtitle{text-align:center;color:var(--soft);font-size:15px;margin:0 0 14px;}
  .map{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:16px 14px;box-shadow:0 8px 22px rgba(60,90,100,.08);}
  body.calm .map{box-shadow:none;}
  .bar{height:14px;background:#e9eef0;border-radius:20px;overflow:hidden;margin:4px 0 16px;}
  .bar > i{display:block;height:100%;width:0;border-radius:20px;background:linear-gradient(90deg,var(--g1),var(--g2));transition:width .5s ease;}
  body.calm .bar > i{background:#6aa9a5;transition:none;}
  .stations{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:520px){.stations{grid-template-columns:1fr;}}
  .st{display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-radius:18px;padding:12px;background:#fbfdfd;cursor:pointer;text-align:left;transition:transform .12s;}
  .st:not(.lock):hover{transform:translateY(-2px);} body.calm .st:hover{transform:none;}
  .st .ic{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;flex:0 0 auto;color:#fff;}
  .st.g1 .ic{background:var(--g1);} .st.g2 .ic{background:var(--g2);} .st.g3 .ic{background:var(--g3);} .st.g4 .ic{background:var(--g4);}
  body.calm .st .ic{filter:saturate(.6);}
  .st .tx{flex:1;min-width:0;} .st .tx b{display:block;font-size:18px;font-weight:800;} .st .tx small{color:var(--soft);font-size:13.5px;}
  .st .flag{font-size:22px;flex:0 0 auto;} .st.lock{opacity:.5;cursor:not-allowed;background:#f1f3f4;}
  .st .dots{display:flex;gap:4px;margin-top:4px;} .st .dots span{width:9px;height:9px;border-radius:50%;background:#dbe4e6;} .st .dots span.f{background:var(--ok);}
  .scene{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:16px 16px 20px;box-shadow:0 8px 22px rgba(60,90,100,.08);}
  body.calm .scene{box-shadow:none;}
  .sceneTop{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .sceneTop .ic{width:40px;height:40px;border-radius:12px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;}
  .sceneTop b{font-size:19px;font-weight:900;}
  .back{margin-left:auto;border:2px solid var(--btnbd);background:var(--btn);border-radius:14px;padding:8px 12px;font-size:15px;font-weight:700;cursor:pointer;min-height:44px;color:var(--ink);}
  .chips{display:flex;gap:6px;margin:2px 0 12px;flex-wrap:wrap;}
  .chip{font-size:14px;font-weight:800;padding:6px 12px;border-radius:20px;background:#eef3f4;color:var(--soft);border:2px solid transparent;}
  .chip.cur{background:var(--focus);color:#fff;} .chip.dn{background:var(--okbg);color:var(--ok);}
  .guide{display:flex;gap:10px;align-items:flex-start;background:#f3faf9;border:2px solid #d5ecea;border-radius:16px;padding:12px;margin-bottom:12px;}
  body.calm .guide{background:#f3f6f6;border-color:#e0e6e6;}
  .guide .star{font-size:30px;line-height:1;}
  body:not(.calm) .guide .star{animation:bob 2.4s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .guide .bub{flex:1;font-size:17.5px;font-weight:600;}
  .sayBtn{border:none;background:#dff1ef;color:var(--g1);border-radius:12px;width:44px;height:44px;font-size:20px;cursor:pointer;flex:0 0 auto;}
  body.calm .sayBtn{background:#e7eeee;color:#5b8f8c;}
  .stage{margin:6px 0 14px;display:flex;justify-content:center;flex-wrap:wrap;gap:10px;}
  .qtext{font-size:22px;font-weight:800;text-align:center;margin:6px 0 14px;}
  .opts{display:grid;gap:12px;}
  .opt{display:flex;align-items:center;gap:10px;border:3px solid var(--btnbd);background:#fbfdfd;border-radius:18px;padding:16px 16px;font-size:21px;font-weight:800;cursor:pointer;min-height:60px;text-align:left;color:var(--ink);width:100%;transition:transform .1s;}
  .opt:hover{border-color:var(--focus);} .opt .lab{flex:1;} .opt .spk{background:transparent;border:none;font-size:20px;cursor:pointer;color:var(--soft);padding:4px;}
  .opt.right{border-color:var(--ok);background:var(--okbg);color:var(--ok);}
  .opt.wrong{border-color:var(--warn);background:var(--warnbg);color:var(--warn);}
  body:not(.calm) .opt.wrong{animation:wob .4s;}
  @keyframes wob{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .opt[disabled]{cursor:default;}
  .hint{margin-top:12px;background:#fff7ec;border:2px dashed #eac489;border-radius:14px;padding:12px 14px;font-size:17px;font-weight:600;color:#8a5a1c;display:none;}
  .hint.show{display:block;} .hint b{color:var(--warn);}
  .go{display:block;width:100%;margin-top:16px;border:none;border-radius:18px;padding:16px;font-size:21px;font-weight:900;color:#fff;background:var(--ok);cursor:pointer;min-height:62px;}
  .go.big{background:linear-gradient(90deg,var(--g1),var(--g2));} body.calm .go.big{background:#5b8f8c;} .go.watch{background:var(--focus);}
  .progressDots{display:flex;gap:7px;justify-content:center;margin-bottom:10px;}
  .progressDots span{width:12px;height:12px;border-radius:50%;background:#dbe4e6;} .progressDots span.cur{background:var(--focus);transform:scale(1.25);} .progressDots span.f{background:var(--ok);}
  .eq{font-size:28px;font-weight:900;text-align:center;font-variant-numeric:tabular-nums;line-height:1.5;}
  .eq .z{color:var(--g3);} .eq .p{color:var(--ok);} .eq .m{color:var(--g4);} .eq .q{color:var(--g1);}
  .note0{color:var(--g3);font-size:15px;text-align:center;font-weight:800;margin-top:2px;}
  .symbig{font-size:58px;font-weight:900;text-align:center;line-height:1;}
  .symbig.plus{color:var(--ok);} .symbig.minus{color:var(--g4);}
  .symcap{text-align:center;color:var(--soft);font-size:15px;margin-top:2px;font-weight:700;}
  .pvb{border-collapse:collapse;margin:0 auto;}
  .pvb th{font-size:13px;color:var(--soft);font-weight:800;padding:4px 16px;border:2px solid #b9cdd0;background:#eef5f6;line-height:1.25;}
  .pvb td{font-size:28px;font-weight:900;text-align:center;padding:6px 16px;border:2px solid #b9cdd0;}
  .pvb td.hi{background:#fff2c9;color:#c77a12;}
  .dv{display:inline-block;}
  .dvrow{display:flex;justify-content:flex-end;align-items:center;}
  .dvrow .op{width:28px;text-align:center;font-size:26px;font-weight:900;color:var(--g2);flex:0 0 auto;}
  .dvcell{width:26px;height:38px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;flex:0 0 auto;}
  .dvcell.dot{width:12px;}
  .dvcell.pad{color:var(--g3);}
  .dvcell.ans{color:var(--g1);}
  .dvline{border-top:3px solid var(--ink);margin:3px 0;}
  .gridwrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin:4px 0 6px;}
  .g100board{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;width:min(320px,86vw);aspect-ratio:1/1;background:#cfe6e3;padding:3px;border-radius:10px;border:2px solid #9fc4c0;touch-action:manipulation;}
  .gcell{border:1px solid #bcd6d2;background:#fff;border-radius:3px;cursor:pointer;padding:0;min-width:0;min-height:0;transition:background .08s;}
  .gcell:hover{background:#eafaf8;}
  .gcell.on{background:#2fb5aa;border-color:#2fb5aa;}
  body.calm .gcell.on{background:#5b9f99;}
  .gcount{font-size:21px;font-weight:900;color:var(--soft);}
  .gcount.ok{color:var(--ok);}
  .rulerwrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin:4px 0 6px;width:100%;}
  .rctrls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
  .rbtn{border:2px solid var(--btnbd);background:var(--btn);color:var(--ink);border-radius:14px;padding:10px 16px;font-size:19px;font-weight:900;cursor:pointer;min-height:48px;min-width:62px;}
  .rbtn:hover{border-color:var(--focus);}
  .rcount{font-size:21px;font-weight:900;color:var(--soft);}
  .rcount.ok{color:var(--ok);}
  .cmpwrap{display:flex;flex-direction:column;align-items:center;gap:12px;}
  .cmpboard{display:flex;align-items:stretch;gap:3px;justify-content:center;flex-wrap:nowrap;}
  .cmpcol{display:flex;flex-direction:column;align-items:center;border:2px solid #e0e6e6;border-radius:10px;padding:4px;min-width:42px;}
  .cmpcol.active{border-color:var(--g1);background:#eafaf8;cursor:pointer;}
  .cmpcol.eq{background:#eef2f3;border-color:#d6dede;}
  .cmpcol.win{background:#e5f6ee;border-color:var(--ok);}
  .cmpdot{display:flex;flex-direction:column;align-items:center;padding:4px 0;}
  .cmpcol .pn,.cmpdot .pn{font-size:10px;color:var(--soft);font-weight:800;white-space:nowrap;height:30px;display:flex;align-items:center;}
  .cmpcol .da,.cmpcol .db,.cmpdot .da,.cmpdot .db{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;height:34px;display:flex;align-items:center;}
  .cmpcol .dwin{color:var(--ok);}
  .cmpcol .hand,.cmpdot .hand{height:20px;font-size:16px;line-height:1;}
  .cmpstatus{font-size:18px;font-weight:800;color:var(--soft);min-height:28px;text-align:center;}
  .cmpstatus.ok{color:var(--ok);}
  .celebrate{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden;}
  .conf{position:absolute;top:-20px;font-size:22px;animation:fall 2.2s linear forwards;}
  @keyframes fall{to{transform:translateY(105vh) rotate(360deg);opacity:.2;}}
  .foot{text-align:center;color:var(--soft);font-size:13px;margin-top:20px;line-height:1.8;}
  .hidden{display:none !important;}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important;transition:none !important;} }
</style>

<script>
"use strict";
function dParts(s){ const a=String(s).split("."); return [a[0], a[1]||""]; }
function grid100(n){
  const c=14,o=4,sz=o*2+c*10; let s=`<svg viewBox="0 0 ${sz} ${sz}" width="100%" style="max-width:148px" xmlns="http://www.w3.org/2000/svg">`;
  const full=Math.floor(n/10), rem=n%10;
  for(let col=0;col<10;col++) for(let row=0;row<10;row++){
    const f = col<full || (col===full && row<rem);
    s+=`<rect x="${o+col*c}" y="${o+row*c}" width="${c}" height="${c}" fill="${f?'#7fd0c9':'#ffffff'}" stroke="#9fc4c0" stroke-width="1"/>`;
  }
  return s+`</svg>`;
}
function cmpCols(a,b){
  const pa=dParts(a), pb=dParts(b);
  const intW=Math.max(pa[0].length,pb[0].length), dp=Math.max(pa[1].length,pb[1].length);
  const sa=pa[0].padStart(intW,"0")+pa[1].padEnd(dp,"0");
  const sb=pb[0].padStart(intW,"0")+pb[1].padEnd(dp,"0");
  const intN=["個位","十位","百位"], decN=["十分位","百分位"], names=[];
  for(let k=intW-1;k>=0;k--) names.push(intN[k]||"整數");
  for(let k=0;k<dp;k++) names.push(decN[k]||"小數");
  return { names, da:sa.split("").map(Number), db:sb.split("").map(Number), dot:intW };
}
function initCmp(a,b){ const c=cmpCols(a,b); return {aStr:a,bStr:b,names:c.names,da:c.da,db:c.db,dot:c.dot,next:0,done:false,winCol:-1,winSide:null}; }
function cmpColsHTML(st){
  let cols="";
  for(let i=0;i<st.names.length;i++){
    if(i===st.dot) cols+=`<div class="cmpdot"><div class="pn"></div><div class="da">．</div><div class="db">．</div><div class="hand"></div></div>`;
    const active=(i===st.next && !st.done), win=(st.done&&i===st.winCol);
    let cls="cmpcol"; if(active)cls+=" active"; if(i<st.next && !win)cls+=" eq"; if(win)cls+=" win";
    const daW=(win&&st.winSide==="a")?"da dwin":"da", dbW=(win&&st.winSide==="b")?"db dwin":"db";
    cols+=`<div class="${cls}" ${active?'data-act="cmp"':''}><div class="pn">${st.names[i]}</div><div class="${daW}">${st.da[i]}</div><div class="${dbW}">${st.db[i]}</div><div class="hand">${active?"👆":""}</div></div>`;
  }
  return cols;
}
function cmpStatus(st){
  if(!st.done) return st.next===0 ? "從最左邊（最大位）開始，點一下比比看。" : "這一位一樣，再比下一位！點點看。";
  if(st.winSide==="eq") return "每一位都一樣，兩個一樣大！";
  return (st.winSide==="a"?st.aStr:st.bStr)+" 比較大！";
}
function cmpWidget(){ return `<div class="cmpboard">${cmpColsHTML(cmp)}</div><div class="cmpstatus ${cmp.done?'ok':''}">${cmpStatus(cmp)}</div>`; }
function cmpBoardStatic(a,b){
  const st=initCmp(a,b);
  while(!st.done){ const i=st.next; if(st.da[i]===st.db[i]){ st.next=i+1; if(st.next>=st.names.length){st.done=true;st.winSide="eq";} } else { st.done=true; st.winCol=i; st.winSide=st.da[i]>st.db[i]?"a":"b"; } }
  st.next=st.names.length;
  return `<div class="cmpboard">${cmpColsHTML(st)}</div><div class="cmpstatus ok">${cmpStatus(st)}</div>`;
}
function rulerSVG(cm, interactive){
  const L=16, scale=3.28;
  let s=`<svg viewBox="0 0 360 86" width="100%" style="max-width:360px" xmlns="http://www.w3.org/2000/svg">`;
  s+=`<text x="180" y="13" font-size="12" text-anchor="middle" fill="#5b6f7a" font-weight="800">1 公尺 ＝ 100 公分</text>`;
  s+=`<line x1="${L}" y1="55" x2="${(L+100*scale).toFixed(1)}" y2="55" stroke="#4a6a74" stroke-width="2"/>`;
  for(let c=0;c<=100;c++){ const x=L+c*scale; const h=c%10===0?15:(c%5===0?10:6);
    s+=`<line x1="${x.toFixed(1)}" y1="${55-h}" x2="${x.toFixed(1)}" y2="55" stroke="#7d97a0" stroke-width="${c%10===0?1.4:0.8}"/>`;
    if(c%10===0) s+=`<text x="${x.toFixed(1)}" y="72" font-size="10" text-anchor="middle" fill="#5b6f7a" font-weight="700">${c}</text>`;
  }
  s+=`<text x="${(L+100*scale).toFixed(1)}" y="84" font-size="10" text-anchor="end" fill="#5b6f7a">公分</text>`;
  const tx=(cm*scale).toFixed(1);
  s+=`<g id="rptg" transform="translate(${interactive?0:tx},0)"><line x1="${L}" y1="22" x2="${L}" y2="55" stroke="#e0658a" stroke-width="2.5"/><polygon points="${L},18 ${L-5},8 ${L+5},8" fill="#e0658a"/></g>`;
  return s+`</svg>`;
}
function dvert(a,b,op,ans,showAns){
  const pa=dParts(a),pb=dParts(b),pr=dParts(ans);
  const intW=Math.max(pa[0].length,pb[0].length,pr[0].length), dp=Math.max(pa[1].length,pb[1].length,pr[1].length);
  function row(iPart,dPart,cls){
    let out=""; const ip=iPart.padStart(intW," ");
    for(const ch of ip) out+=`<span class="dvcell ${cls||''}">${ch===" "?"":ch}</span>`;
    out+=`<span class="dvcell dot ${cls||''}">.</span>`;
    const dpad=dPart.padEnd(dp,"0");
    for(let k=0;k<dp;k++) out+=`<span class="dvcell ${cls||''} ${k>=dPart.length?'pad':''}">${dpad[k]}</span>`;
    return out;
  }
  const lineW=(intW+dp)*26+12;
  let s=`<div class="dv">`;
  s+=`<div class="dvrow"><span class="op"></span>${row(pa[0],pa[1])}</div>`;
  s+=`<div class="dvrow"><span class="op">${op}</span>${row(pb[0],pb[1])}</div>`;
  s+=`<div class="dvline" style="width:${lineW}px;margin-left:auto"></div>`;
  if(showAns) s+=`<div class="dvrow"><span class="op"></span>${row(pr[0],pr[1],'ans')}</div>`;
  return s+`</div>`;
}
const V={
  grid:grid100, dvert:dvert,
  eq(html,note){ return `<div class="eq">${html}</div>`+(note?`<div class="note0">${note}</div>`:""); },
  sym(op){ const plus=op==="＋";
    return `<div><div class="symbig ${plus?"plus":"minus"}">${op}</div><div class="symcap">${plus?"加　合起來　共":"減　相差　剩下"}</div></div>`; },
  board(a,b,c,hi){ return `<table class="pvb"><tr><th>個<br>位</th><th>十<br>分<br>位</th><th>百<br>分<br>位</th></tr>`+
    `<tr><td class="${hi===0?'hi':''}">${a}</td><td class="${hi===1?'hi':''}">${b}</td><td class="${hi===2?'hi':''}">${c}</td></tr></table>`; }
};

/* ============ 引擎（與前幾單元相同） ============ */
const KEY="sped_math_decimal_v1";
let prog={ guan:[], calm:false, speak:true };
try{ const s=localStorage.getItem(KEY); if(s) prog=Object.assign(prog, JSON.parse(s)); }catch(e){}
while(prog.guan.length<SCENES.length) prog.guan.push(0);
prog.guan=prog.guan.slice(0,SCENES.length);
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(prog)); }catch(e){} }

let view="map", gi=0, li=0, ii=0, answered=false, gridShaded=new Set(), rulerCm=0, cmp=null;
const app=document.getElementById("app");

let zhVoice=null;
function pickVoice(){ const vs=window.speechSynthesis?speechSynthesis.getVoices():[]; zhVoice=vs.find(v=>/zh[-_]TW/i.test(v.lang))||vs.find(v=>/zh/i.test(v.lang))||null; }
if(window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function speak(t){ if(!prog.speak||!t||!window.speechSynthesis) return;
  try{ speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(String(t).replace(/＋/g,"加").replace(/－/g,"減").replace(/＞/g,"大於").replace(/＜/g,"小於").replace(/＝/g,"等於").replace(/□/g,"").replace(/\?/g,""));
    u.lang="zh-TW"; u.rate=.92; u.pitch=1.02; if(zhVoice)u.voice=zhVoice; speechSynthesis.speak(u);
  }catch(e){} }
function stopSpeak(){ if(window.speechSynthesis) try{speechSynthesis.cancel();}catch(e){} }

function party(){ if(prog.calm) return;
  const box=document.getElementById("celebrate"); box.classList.remove("hidden"); box.innerHTML="";
  const em=["⭐","🎉","✨","🌟","💫"];
  for(let i=0;i<24;i++){ const s=document.createElement("div"); s.className="conf"; s.textContent=em[i%em.length];
    s.style.left=(Math.random()*100)+"%"; s.style.animationDelay=(Math.random()*.5)+"s"; s.style.fontSize=(18+Math.random()*16)+"px"; box.appendChild(s); }
  setTimeout(()=>{box.classList.add("hidden");box.innerHTML="";},2400);
}

function totalLayers(){ return SCENES.length*4; }
function doneLayers(){ return prog.guan.reduce((a,b)=>a+b,0); }
function guanUnlocked(g){ return g===0 || prog.guan[g-1]>=4; }
function render(){ if(view==="map") renderMap(); else renderScene(); updateCtrl(); }
function updateCtrl(){ document.body.classList.toggle("calm", prog.calm);
  document.getElementById("btnCalm").classList.toggle("on", prog.calm);
  const bs=document.getElementById("btnSpeak"); bs.classList.toggle("on", prog.speak); bs.textContent=prog.speak?"🔊 朗讀：開":"🔇 朗讀：關"; }
function renderMap(){ const pct=Math.round(doneLayers()/totalLayers()*100); let sts="";
  SCENES.forEach((s,g)=>{ const lock=!guanUnlocked(g), done=prog.guan[g]>=4;
    let dots=""; for(let k=0;k<4;k++) dots+=`<span class="${k<prog.guan[g]?"f":""}"></span>`;
    sts+=`<button class="st ${s.cls} ${lock?"lock":""}" data-act="${lock?"":"open"}" data-g="${g}">
      <span class="ic">${lock?"🔒":s.icon}</span>
      <span class="tx"><b>第 ${s.id} 關　${s.title}</b><small>${s.sub}</small><span class="dots">${dots}</span></span>
      <span class="flag">${done?"✅":(lock?"":"▶")}</span></button>`; });
  app.innerHTML=`<div class="map"><div class="bar"><i style="width:${pct}%"></i></div>
    <div class="guide"><span class="star">⭐</span>
      <div class="bub">${doneLayers()===0?"哈囉，我是林老師！這一單元我們一起認識小數、換算、比大小和加減。點下面亮亮的關卡出發吧。":
        (pct===100?"全部通關了，你把小數學起來了，整本數學都完成了，太棒了！":"做得好！接著點亮亮的關卡繼續喔。")}</div>
      <button class="sayBtn" data-act="say" data-text="哈囉，我是小星，這一單元我們一起認識小數、換算、比大小和加減。點亮亮的關卡出發吧。">🔊</button></div>
    <div class="stations">${sts}</div></div>`; }
function renderScene(){ const s=SCENES[gi], layer=s.layers[li]; let chips="";
  s.layers.forEach((L,k)=>{ const cls=k<prog.guan[gi]?"dn":(k===li?"cur":""); chips+=`<span class="chip ${cls}">${L.label}${k<prog.guan[gi]?" ✓":""}</span>`; });
  let body="";
  if(layer.kind==="watch"){ const st=layer.steps[ii], last=ii===layer.steps.length-1;
    body=`<div class="guide"><span class="star">⭐</span><div class="bub">${st.say}</div><button class="sayBtn" data-act="say" data-text="${esc(st.say)}">🔊</button></div>
      <div class="stage">${st.html}</div>
      ${last?`<button class="go watch" data-act="watchdone">我看懂了，往下 ▶</button>`:`<button class="go watch" data-act="watchnext">繼續看 ▶</button>`}`;
  }else{ const it=layer.items[ii]; let dots=""; layer.items.forEach((_,k)=> dots+=`<span class="${k<ii?"f":(k===ii?"cur":"")}"></span>`);
    let middle;
    if(it.gridTarget!=null){
      gridShaded=new Set();
      let cells=""; for(let c=0;c<100;c++) cells+=`<button class="gcell" data-act="cell" data-i="${c}" aria-label="格子"></button>`;
      middle=`<div class="gridwrap"><div class="g100board">${cells}</div><div class="gcount" id="gcount">已塗 0 格</div></div>`;
    } else if(it.rulerTarget!=null){
      rulerCm=0;
      middle=`<div class="rulerwrap">${rulerSVG(0,true)}
        <div class="rctrls">
          <button class="rbtn" data-act="rstep" data-d="-10">－10</button>
          <button class="rbtn" data-act="rstep" data-d="-1">－1</button>
          <button class="rbtn" data-act="rstep" data-d="1">＋1</button>
          <button class="rbtn" data-act="rstep" data-d="10">＋10</button>
        </div>
        <div class="rcount" id="rcount">指到 0 公分　＝　0 公尺</div></div>`;
    } else if(it.cmp){
      cmp=initCmp(it.a,it.b);
      middle=`<div class="cmpwrap" id="cmpbox">${cmpWidget()}</div>`;
    } else {
      let opts=""; it.choices.forEach((c,k)=>{ const lab=c[1]?c[1]:c[0];
        opts+=`<button class="opt" data-act="ans" data-k="${k}"><span class="lab">${lab}</span><button class="spk" data-act="say" data-text="${esc(lab)}">🔊</button></button>`; });
      middle=`<div class="opts">${opts}</div>`;
    }
    const hintCls = (it.gridTarget!=null||it.rulerTarget!=null||it.cmp) ? "hint show" : "hint";
    body=`<div class="progressDots">${dots}</div>
      <div class="guide"><span class="star">⭐</span><div class="bub">${it.say}</div><button class="sayBtn" data-act="say" data-text="${esc(it.say)}">🔊</button></div>
      ${it.html?`<div class="stage">${it.html}</div>`:""}
      <div class="qtext">${it.q}</div>${middle}
      <div class="${hintCls}" id="hintBox"><b>小提示：</b>${it.hint}</div>
      <button class="go big hidden" id="nextBtn" data-act="next">做對了，繼續 ▶</button>`;
  }
  app.innerHTML=`<div class="scene"><div class="sceneTop"><span class="ic" style="background:var(--${s.cls})">${s.icon}</span>
    <b>第 ${s.id} 關　${s.title}</b><button class="back" data-act="map">🗺️ 地圖</button></div>
    <div class="chips">${chips}</div>${body}</div>`;
  answered=false; const sayText=layer.kind==="watch"?layer.steps[ii].say:layer.items[ii].say; setTimeout(()=>speak(sayText),260);
}
function esc(t){ return String(t).replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
function openGuan(g){ gi=g; li=Math.min(prog.guan[g],3); ii=0; view="scene"; render(); }
function completeLayer(){ if(prog.guan[gi]<li+1){ prog.guan[gi]=li+1; save(); }
  if(li>=3){ stopSpeak(); party(); setTimeout(()=>speak("這一關全部完成，你好棒！"),200); view="map"; render(); } else { li+=1; ii=0; render(); } }
function onAnswer(k){ const layer=SCENES[gi].layers[li], it=layer.items[ii]; const btns=[...app.querySelectorAll(".opt")], target=btns[k]; if(answered) return;
  if(k===it.ans){ answered=true; target.classList.add("right"); target.querySelector(".lab").insertAdjacentHTML("beforeend"," ⭐"); btns.forEach(b=>b.setAttribute("disabled","1"));
    const praise=["答對了，你好棒！","太厲害了，就是這樣！","你自己算出來了！","完全正確！"][Math.floor(Math.random()*4)];
    stopSpeak(); setTimeout(()=>speak(praise),120); const nb=document.getElementById("nextBtn"); nb.classList.remove("hidden"); nb.textContent=(ii>=layer.items.length-1)?"這一層完成 ▶":"做對了，繼續 ▶";
  }else{ target.classList.add("wrong"); setTimeout(()=>target.classList.remove("wrong"),700); document.getElementById("hintBox").classList.add("show");
    stopSpeak(); setTimeout(()=>speak("沒關係，再想一想。"+it.hint),120); } }
function fmtDec(n){ return (n/100).toFixed(2).replace(/(\.\d)0$/,'$1'); }
function onCell(i,btn){
  const it=SCENES[gi].layers[li].items[ii]; if(!it||it.gridTarget==null||answered) return;
  if(gridShaded.has(i)){ gridShaded.delete(i); btn.classList.remove("on"); }
  else { gridShaded.add(i); btn.classList.add("on"); }
  const n=gridShaded.size, gc=document.getElementById("gcount");
  gc.textContent = n>0 ? `已塗 ${n} 格　＝　${fmtDec(n)} 張` : "已塗 0 格";
  gc.classList.toggle("ok", n===it.gridTarget);
  if(n===it.gridTarget){ answered=true; stopSpeak(); party(); setTimeout(()=>speak("太棒了，數對了！"),120);
    const nb=document.getElementById("nextBtn"); nb.classList.remove("hidden");
    nb.textContent=(ii>=SCENES[gi].layers[li].items.length-1)?"這一層完成 ▶":"做對了，繼續 ▶"; }
}
function nextItem(){ const layer=SCENES[gi].layers[li]; if(ii>=layer.items.length-1) completeLayer(); else { ii+=1; render(); } }
function onRstep(d){
  const it=SCENES[gi].layers[li].items[ii]; if(!it||it.rulerTarget==null||answered) return;
  rulerCm=Math.max(0,Math.min(100,rulerCm+d));
  const g=document.getElementById("rptg"); if(g) g.setAttribute("transform",`translate(${(rulerCm*3.28).toFixed(1)},0)`);
  const rc=document.getElementById("rcount");
  rc.textContent = `指到 ${rulerCm} 公分　＝　${rulerCm===0?"0":fmtDec(rulerCm)} 公尺`;
  rc.classList.toggle("ok", rulerCm===it.rulerTarget);
  if(rulerCm===it.rulerTarget){ answered=true; stopSpeak(); party(); setTimeout(()=>speak("太棒了，指對了！"),120);
    const nb=document.getElementById("nextBtn"); nb.classList.remove("hidden");
    nb.textContent=(ii>=SCENES[gi].layers[li].items.length-1)?"這一層完成 ▶":"做對了，繼續 ▶"; }
}
function onCmp(){
  if(!cmp||cmp.done) return;
  const i=cmp.next;
  if(cmp.da[i]===cmp.db[i]){ cmp.next=i+1; if(cmp.next>=cmp.names.length){ cmp.done=true; cmp.winSide="eq"; } }
  else { cmp.done=true; cmp.winCol=i; cmp.winSide=cmp.da[i]>cmp.db[i]?"a":"b"; }
  const box=document.getElementById("cmpbox"); if(box) box.innerHTML=cmpWidget();
  if(cmp.done){ answered=true; stopSpeak(); party();
    const msg = cmp.winSide==="eq" ? "每一位都一樣，兩個一樣大" : ((cmp.winSide==="a"?cmp.aStr:cmp.bStr)+" 比較大");
    setTimeout(()=>speak(msg),120);
    const nb=document.getElementById("nextBtn"); nb.classList.remove("hidden");
    nb.textContent=(ii>=SCENES[gi].layers[li].items.length-1)?"這一層完成 ▶":"做對了，繼續 ▶"; }
}
document.body.addEventListener("click",(e)=>{ const b=e.target.closest("[data-act]"); if(!b) return; const act=b.dataset.act;
  if(act==="say"){ e.stopPropagation(); speak(b.dataset.text); return; }
  if(act==="calm"){ prog.calm=!prog.calm; save(); render(); return; }
  if(act==="speak"){ prog.speak=!prog.speak; save(); if(!prog.speak) stopSpeak(); updateCtrl(); return; }
  if(act==="restart"){ if(confirm("要把進度全部清掉，從第一關重新開始嗎？")){ prog.guan=SCENES.map(()=>0); save(); view="map"; stopSpeak(); render(); } return; }
  if(act==="open"){ openGuan(parseInt(b.dataset.g,10)); return; }
  if(act==="map"){ view="map"; stopSpeak(); render(); return; }
  if(act==="watchnext"){ ii+=1; render(); return; }
  if(act==="watchdone"){ completeLayer(); return; }
  if(act==="ans"){ onAnswer(parseInt(b.dataset.k,10)); return; }
  if(act==="cell"){ onCell(parseInt(b.dataset.i,10), b); return; }
  if(act==="rstep"){ onRstep(parseInt(b.dataset.d,10)); return; }
  if(act==="cmp"){ onCmp(); return; }
  if(act==="next"){ nextItem(); return; }
});
render();
</script>

<script>
(function(){
  function fit(){
    var nav=document.getElementById('jiang-nav'); if(!nav) return;
    var h=nav.offsetHeight||0;
    document.documentElement.style.setProperty('--jnav-h', h+'px');
    try{ document.documentElement.style.scrollPaddingTop=h+'px'; }catch(e){}
    var tb=document.querySelector('.toolbar'); /* 評量頁既有列印工具列 */
    if(tb){ tb.style.top=h+'px'; }
  }
  if(document.readyState!=='loading') fit(); else document.addEventListener('DOMContentLoaded',fit);
  window.addEventListener('load',fit); window.addEventListener('resize',fit);
})();
</script>

</body>
